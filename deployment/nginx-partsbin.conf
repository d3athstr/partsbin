# PartsBin VM-local nginx vhost
# Shield terminates TLS for parts.example.com and proxies here over HTTP.
# Install: /etc/nginx/sites-available/partsbin -> sites-enabled/partsbin

server {
    listen 80 default_server;
    server_name parts.example.com partsbin partsbin.internal _;

    root /opt/partsbin/frontend/dist;
    index index.html;

    client_max_body_size 64m;

    # API -> gunicorn
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Uploaded files -> gunicorn (app enforces login on /uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA static build with client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
