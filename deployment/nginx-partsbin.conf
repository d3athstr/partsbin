# PartsBin VM-local nginx vhost
# The edge proxy terminates TLS for parts.example.com and proxies here over HTTP.
# Install: /etc/nginx/sites-available/partsbin -> sites-enabled/partsbin

server {
    listen 80 default_server;
    server_name parts.example.com partsbin partsbin.internal _;

    root /opt/partsbin/frontend/dist;
    index index.html;

    # Must exceed MAX_MODEL_SIZE (64MB 3D models) plus multipart overhead;
    # The edge proxy in front is set to 80m to match.
    client_max_body_size 80m;

    # API -> gunicorn
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Uploaded files -> gunicorn (app enforces login on /uploads)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA static build with client-side routing fallback.
    # index.html must never be cached or deploys don't reach browsers
    # (hashed /assets/ bundles keep long cache below).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static asset caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
